<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TACTIC Backend Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      background: #171717;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
    }

    pre {
      background: #111;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>TACTIC Backend Test</h1>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="register()">
    1. Register
  </button>

  <button onclick="login()">
    2. Login
  </button>

  <input
    id="deviceId"
    placeholder="Device ID e.g. TAC-000001"
  >

  <input
    id="userId"
    placeholder="User ID"
  >

  <button onclick="myDevices()">
    3. My Devices
  </button>

  <pre id="output">Output yahan dikhega...</pre>

<script>

const BASE_URL = "/.netlify/functions";

let sessionToken = "";

function show(data) {
  document.getElementById("output").textContent =
    JSON.stringify(data, null, 2);
}


/* =========================
   REGISTER
========================= */

async function register() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const res = await fetch(
    `${BASE_URL}/auth`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        action: "register",
        email,
        password
      })
    }
  );

  const data = await res.json();

  show(data);

  if (data.userId) {
    document.getElementById("userId").value =
      data.userId;
  }
}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const res = await fetch(
    `${BASE_URL}/auth`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        action: "login",
        email,
        password
      })
    }
  );

  const data = await res.json();

  show(data);

  if (data.token) {
    sessionToken = data.token;
  }

  if (data.userId) {
    document.getElementById("userId").value =
      data.userId;
  }
}


/* =========================
   MY DEVICES
========================= */

async function myDevices() {

  if (!sessionToken) {
    show({
      error: "Pehle Login button dabao"
    });

    return;
  }

  const res = await fetch(
    `${BASE_URL}/my-devices`,
    {
      method: "GET",

      headers: {
        "Authorization":
          `Bearer ${sessionToken}`
      }
    }
  );

  const data = await res.json();

  show(data);
}

</script>

</body>
</html>
